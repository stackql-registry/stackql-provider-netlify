openapi: 3.0.0
info:
  title: functions API
  description: netlify functions API
  version: 2.57.0
paths:
  /sites/{site_id}/functions:
    get:
      operationId: searchSiteFunctions
      tags:
        - function
      parameters:
        - name: site_id
          in: path
          required: true
          schema:
            type: string
        - name: filter
          in: query
          required: false
          schema:
            type: string
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                type: array
                items:
                  type: object
                  properties:
                    branch:
                      type: string
                    created_at:
                      type: string
                      format: dateTime
                    functions:
                      type: array
                      items:
                        type: string
                        description: (opaque JSON object)
                    id:
                      type: string
                    log_type:
                      type: string
                    provider:
                      type: string
        default:
          description: error
          content:
            application/json:
              schema:
                type: object
                required:
                  - message
                properties:
                  code:
                    type: integer
                    format: int64
                  message:
                    type: string
                    nullable: false
components:
  schemas: {}
servers:
  - url: https://api.netlify.com/api/v1
