            type: object
            properties:
              id:
                type: string
              site_id:
                type: string
              type:
                type: string
              event:
                type: string
              data:
                type: string
                description: (opaque JSON object)
              created_at:
                type: string
                format: dateTime
              updated_at:
                type: string
                format: dateTime
              disabled:
                type: boolean
      required: true
  schemas: {}
servers:
  - url: https://api.netlify.com/api/v1
