openapi: 3.0.0
info:
  title: hooks API
  description: netlify hooks API
  version: 2.57.0
paths:
  /hooks:
    get:
      operationId: listHooksBySiteId
      tags:
        - hook
      parameters:
        - name: site_id
          in: query
          required: true
          schema:
            type: string
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                type: array
                items:
                  type: object
                  properties:
                    id:
                      type: string
                    site_id:
                      type: string
                    type:
                      type: string
                    event:
                      type: string
                    data:
                      type: string
                      description: (opaque JSON object)
                    created_at:
                      type: string
                      format: dateTime
                    updated_at:
                      type: string
                      format: dateTime
                    disabled:
                      type: boolean
        default:
          description: error
          content:
            application/json:
              schema:
                type: object
                required:
                  - message
                properties:
                  code:
                    type: integer
                    format: int64
                  message:
                    type: string
                    nullable: false
    post:
      operationId: createHookBySiteId
      tags:
        - hook
      parameters:
        - name: site_id
          in: query
          required: true
          schema:
            type: string
      requestBody:
        $ref: '#/components/requestBodies/createHookBySiteIdHook'
      responses:
        '201':
          description: OK
          content:
            application/json:
              schema:
                type: object
                properties:
                  id:
                    type: string
                  site_id:
                    type: string
                  type:
                    type: string
                  event:
                    type: string
                  data:
                    type: string
                    description: (opaque JSON object)
                  created_at:
                    type: string
                    format: dateTime
                  updated_at:
                    type: string
                    format: dateTime
                  disabled:
                    type: boolean
        default:
          description: error
          content:
            application/json:
              schema:
                type: object
                required:
                  - message
                properties:
                  code:
                    type: integer
                    format: int64
                  message:
                    type: string
                    nullable: false
