              schema:
                type: object
                required:
                  - message
                properties:
                  code:
                    type: integer
                    format: int64
                  message:
                    type: string
                    nullable: false
      parameters:
        - name: hook_id
          in: path
          required: true
          schema:
            type: string
  /hooks/types:
    get:
      operationId: listHookTypes
      tags:
        - hookType
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                type: array
                items:
                  type: object
                  properties:
                    name:
                      type: string
                    events:
                      type: array
                      items:
                        type: string
                    fields:
                      type: array
                      items:
                        type: string
                        description: (opaque JSON object)
        default:
          description: error
          content:
            application/json:
              schema:
                type: object
                required:
                  - message
                properties:
                  code:
                    type: integer
                    format: int64
                  message:
                    type: string
                    nullable: false
components:
