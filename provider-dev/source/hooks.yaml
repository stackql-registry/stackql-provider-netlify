                    type: integer
                    format: int64
                  message:
                    type: string
                    nullable: false
      parameters:
        - name: hook_id
          in: path
          required: true
          schema:
            type: string
    delete:
      operationId: deleteHook
      tags:
        - hook
      responses:
        '204':
          description: No content
      parameters:
        - name: hook_id
          in: path
          required: true
          schema:
            type: string
  /hooks/{hook_id}/enable:
    post:
      operationId: enableHook
      tags:
        - hook
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                type: object
                properties:
                  id:
                    type: string
                  site_id:
                    type: string
                  type:
                    type: string
                  event:
                    type: string
                  data:
                    type: string
                    description: (opaque JSON object)
