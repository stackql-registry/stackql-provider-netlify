            application/json:
              schema:
                type: object
                required:
                  - message
                properties:
                  code:
                    type: integer
                    format: int64
                  message:
                    type: string
                    nullable: false
      parameters:
        - name: hook_id
          in: path
          required: true
          schema:
            type: string
    put:
      operationId: updateHook
      tags:
        - hook
      requestBody:
        $ref: '#/components/requestBodies/createHookBySiteIdHook'
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                type: object
                properties:
                  id:
                    type: string
                  site_id:
                    type: string
                  type:
                    type: string
                  event:
                    type: string
                  data:
                    type: string
                    description: (opaque JSON object)
                  created_at:
                    type: string
