openapi: 3.0.0
info:
  title: users API
  description: netlify users API
  version: 2.57.0
paths:
  /user:
    get:
      operationId: getCurrentUser
      tags:
        - user
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                type: object
                properties:
                  id:
                    type: string
                  uid:
                    type: string
                  full_name:
                    type: string
                  avatar_url:
                    type: string
                  email:
                    type: string
                  affiliate_id:
                    type: string
                  site_count:
                    type: integer
                    format: int64
                  created_at:
                    type: string
                    format: dateTime
                  last_login:
                    type: string
                    format: dateTime
                  login_providers:
                    type: array
                    items:
                      type: string
                  onboarding_progress:
                    type: object
                    properties:
                      slides:
                        type: string
        default:
          description: error
          content:
            application/json:
              schema:
                type: object
                required:
                  - message
                properties:
                  code:
                    type: integer
                    format: int64
                  message:
                    type: string
                    nullable: false
components: {}
servers:
  - url: https://api.netlify.com/api/v1
