openapi: 3.0.0
info:
  title: env API
  description: netlify env API
  version: 2.57.0
paths:
  /accounts/{account_id}/env:
    get:
      tags:
        - environmentVariables
      operationId: getEnvVars
      parameters:
        - name: account_id
          description: Scope response to account_id
          required: true
          in: path
          schema:
            type: string
        - name: context_name
          description: Filter by deploy context
          required: false
          in: query
          schema:
            type: string
            enum:
              - all
              - dev
              - dev-server
              - branch-deploy
              - deploy-preview
              - production
        - name: scope
          description: Filter by scope
          required: false
          in: query
          schema:
            type: string
            enum:
              - builds
              - functions
              - runtime
              - post-processing
        - name: site_id
          description: If specified, only return environment variables set on this site
          required: false
          in: query
          schema:
            type: string
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                type: array
                items:
                  type: object
                  properties:
                    key:
                      type: string
                      description: The environment variable key, like ALGOLIA_ID (case-sensitive)
                      x-faker: commerce.productName
                    scopes:
                      type: array
                      items:
                        type: string
                        enum:
                          - builds
                          - functions
                          - runtime
                          - post-processing
                      description: The scopes that this environment variable is set to
                    values:
                      type: array
                      items:
                        type: object
                        properties:
                          id:
                            type: string
                            description: The environment variable value's universally unique ID
                            x-faker: datatype.uuid
                          value:
                            type: string
                            description: The environment variable's unencrypted value
                            x-faker: internet.password
                          context:
                            type: string
                            enum:
                              - all
                              - dev
                              - dev-server
                              - branch-deploy
                              - deploy-preview
                              - production
                              - branch
                            description: The deploy context in which this value will be used. `dev` refers to local development when running `netlify dev`.
                          context_parameter:
                            type: string
                            description: An additional parameter for custom branches. Currently, this is used for specifying a branch name when `context=branch`.
                        description: Environment variable value model definition
                      description: An array of Value objects containing values and metadata
                      x-faker: internet.password
                    is_secret:
                      type: boolean
                      description: Secret values are only readable by code running on Netlify's systems. With secrets, only the local development context values are readable from the UI, API, and CLI. By default, environment variable values are not secret.
                    updated_at:
                      type: string
                      format: date-time
                      description: The timestamp of when the value was last updated
                      x-faker: date.past
                    updated_by:
                      type: object
                      properties:
                        id:
                          type: string
                          description: The user's unique identifier
                          x-faker: datatype.number
                        full_name:
                          type: string
                          description: The user's full name (first and last)
                          x-faker: name.findName
                        email:
                          type: string
                          description: The user's email address
                          x-faker: internet.email
                        avatar_url:
                          type: string
                          description: A URL pointing to the user's avatar
                          x-faker: internet.avatar
                  description: Environment variable model definition
        default:
          description: error
          content:
            application/json:
              schema:
                type: object
                required:
                  - message
                properties:
                  code:
                    type: integer
                    format: int64
                  message:
                    type: string
                    nullable: false
      description: Returns all environment variables for an account or site. An account corresponds to a team in the Netlify UI.
    post:
      tags:
        - environmentVariables
      operationId: createEnvVars
      description: Creates new environment variables. Granular scopes are available on Pro plans and above.
      parameters:
        - name: account_id
          description: Scope response to account_id
          required: true
          in: path
          schema:
            type: string
        - name: site_id
          description: If provided, create an environment variable on the site level, not the account level
          required: false
          in: query
          schema:
            type: string
      requestBody:
        content:
          application/json:
            schema:
              type: array
              items:
                type: object
                properties:
                  key:
                    type: string
                    description: The existing or new name of the key, if you wish to rename it (case-sensitive)
                  scopes:
                    description: The scopes that this environment variable is set to (Pro plans and above)
                    type: array
                    items:
                      type: string
                      enum:
                        - builds
                        - functions
                        - runtime
                        - post-processing
                  values:
                    type: array
                    items:
                      type: object
                      properties:
                        id:
                          type: string
                          description: The environment variable value's universally unique ID
                          x-faker: datatype.uuid
                        value:
                          type: string
                          description: The environment variable's unencrypted value
                          x-faker: internet.password
                        context:
                          type: string
                          enum:
                            - all
                            - dev
                            - dev-server
                            - branch-deploy
                            - deploy-preview
                            - production
                            - branch
                          description: The deploy context in which this value will be used. `dev` refers to local development when running `netlify dev`.
                        context_parameter:
                          type: string
                          description: An additional parameter for custom branches. Currently, this is used for specifying a branch name when `context=branch`.
                      description: Environment variable value model definition
                  is_secret:
                    type: boolean
                    description: Secret values are only readable by code running on Netlify's systems. With secrets, only the local development context values are readable from the UI, API, and CLI. By default, environment variable values are not secret.
      responses:
        '201':
          description: OK
          content:
            application/json:
              schema:
                type: array
                items:
                  type: object
                  properties:
                    key:
                      type: string
                      description: The environment variable key, like ALGOLIA_ID (case-sensitive)
                      x-faker: commerce.productName
                    scopes:
                      type: array
                      items:
                        type: string
                        enum:
                          - builds
                          - functions
                          - runtime
                          - post-processing
                      description: The scopes that this environment variable is set to
                    values:
                      type: array
                      items:
                        type: object
                        properties:
                          id:
                            type: string
                            description: The environment variable value's universally unique ID
                            x-faker: datatype.uuid
                          value:
                            type: string
                            description: The environment variable's unencrypted value
                            x-faker: internet.password
                          context:
                            type: string
                            enum:
                              - all
                              - dev
                              - dev-server
                              - branch-deploy
                              - deploy-preview
                              - production
                              - branch
                            description: The deploy context in which this value will be used. `dev` refers to local development when running `netlify dev`.
                          context_parameter:
                            type: string
                            description: An additional parameter for custom branches. Currently, this is used for specifying a branch name when `context=branch`.
                        description: Environment variable value model definition
                      description: An array of Value objects containing values and metadata
                      x-faker: internet.password
                    is_secret:
                      type: boolean
                      description: Secret values are only readable by code running on Netlify's systems. With secrets, only the local development context values are readable from the UI, API, and CLI. By default, environment variable values are not secret.
                    updated_at:
                      type: string
                      format: date-time
                      description: The timestamp of when the value was last updated
                      x-faker: date.past
                    updated_by:
                      type: object
                      properties:
                        id:
                          type: string
                          description: The user's unique identifier
                          x-faker: datatype.number
                        full_name:
                          type: string
                          description: The user's full name (first and last)
                          x-faker: name.findName
                        email:
                          type: string
                          description: The user's email address
                          x-faker: internet.email
                        avatar_url:
                          type: string
                          description: A URL pointing to the user's avatar
                          x-faker: internet.avatar
                  description: Environment variable model definition
        default:
          description: error
          content:
            application/json:
              schema:
                type: object
                required:
                  - message
                properties:
                  code:
                    type: integer
                    format: int64
                  message:
                    type: string
                    nullable: false
